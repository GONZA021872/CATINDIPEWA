 <!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

  <title>Catalogo CO D MAR </title>

<style>

/* ========================= */
/*          CSS CODMAR        */
/* ========================= */


body {
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}

/* MARCA CODMAR */

.marca{
    text-align:center;
    margin-top:20px;
}

.logo-icono{
    font-size:48px;
    margin-bottom:5px;
}

.marca h1{
    font-size:80px;
    font-weight:900;
    margin:0;
    letter-spacing:4px;
    color:#111;
}

.marca p{
    font-size: 40px;          /* Más grande */
    font-weight: bold;
    color: #555;
    margin-top: 5px;
    margin-bottom: 20px;
    letter-spacing: 2px;      /* Más separación entre letras */
    line-height: 1.4;         /* Hace que la letra se vea más alta */
    text-transform: uppercase;/* Todo en mayúsculas, más profesional */
}


/* BUSCADOR */

#buscar{
    width:90%;
    max-width:700px;
    display:block;
    margin:20px auto;
    padding:18px 20px;
    font-size:28px;
    border:2px solid #ccc;
    border-radius:12px;
    outline:none;
}
/* CATALOGO */

#catalogo{
    text-align:center;
}


.producto{
    border:1px solid #ccc;
    background:white;
    border-radius:10px;
    padding:8px;
    margin:8px;
    width:160px;
    display:inline-block;
    text-align:center;
    vertical-align:top;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

.producto img{
    width:110px;
    height:110px;
    object-fit:contain;

}

.producto h3{
    font-size:14px;
    margin:6px 0;
    min-height:36px;
}

.producto p{
    font-size:18px;
    color:#d32f2f;
    font-weight:bold;
    margin:6px 0;
}




/* BOTON AGREGAR CARRITO */

.boton-carrito{
    display:block;
    width:110%;
    margin-top:6px;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    font-size:18px;
    cursor:pointer;
}



/* BOTON CARRITO PRINCIPAL */

#verCarrito{
    display:block;
    width:40%;
    margin:25px auto;
    height:100px;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:15px;
    font-size:30px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

#verCarrito:hover{
    transform:scale(1.05);
    background:#f57c00;
}

/* VENTANA DEL CARRITO */

#carritoVentana{
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:420px;
    max-height:500px;
    overflow-y:auto;
    background:#fff;
    border-radius:10px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
    z-index:9999;
}



#listaCarrito{
    margin-top:15px;
}



#totalCarrito{
    margin-top:15px;
    font-size:20px;
    font-weight:bold;
    color:#d32f2f;
}



/* BOTONES DEL CARRITO */

.botonesCarrito{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}


.botonesCarrito button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}



#vaciarCarrito{
    background:#d32f2f;
    color:white;
}



#enviarWhatsApp{
    background:#25D366;
    color:white;
}



#cerrarCarrito{
    background:#666;
    color:white;
}



#carritoVentana button{
    margin:5px;
}

#volverCatalogo{
    display:none;
    width:60%;
    max-width:500px;
    margin:20px auto;
    padding:18px 25px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}


#volverCatalogo:hover{
    background:#0b5ed7;
}



/* ===== MODAL PRODUCTO ===== */

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.7);
}

.modal-contenido{

    background:white;

    width:90%;
    max-width:420px;

    position:absolute;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    border-radius:15px;

    padding:20px;

    text-align:center;

    animation:aparecer .25s;
}

.modal-contenido img{

    width:420px;

    height:420px;

    object-fit:contain;

}

#modalNombre{

    font-size:24px;
    margin:15px 0;

}

#modalPrecio{

    font-size:26px;

    color:#e53935;

    font-weight:bold;

}

#agregarModal{

    background:#28a745;

    color:white;

    border:none;

    padding:15px 25px;

    border-radius:10px;

    font-size:18px;

    cursor:pointer;

}

#cerrarModal{

    position:absolute;
    right:15px;
    top:10px;
    font-size:35px;
    cursor:pointer;

}



/* CATEGORÍAS */

.categorias{

    display:flex;
    flex-wrap:nowrap;
    justify-content:flex-start;
    gap:12px;
    width:100%;
    margin:20px auto;
    padding:0 10px;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;

}

.categorias::-webkit-scrollbar{
    display:none;

}

.categorias button{

    flex:0 0 auto;
    min-width:200px;
    height:85px;
    padding:0 30px;
    font-size:20px;
    border-radius:12px;
    background:#0d6efd;
    color:white;
    border:none;
    font-weight:bold;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

}

/* ========================= */
/*   PANEL ADMINISTRACIÓN    */
/* ========================= */

.panel-administracion {
    width: 730px;
    max-width: 730px;
    min-height: 1000px;
    margin: 30px auto;
    padding: 20px 12px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    border: 1px solid #ddd;
    box-sizing: border-box;
}

.panel-administracion h2 {
    text-align: center;
    font-size: 40px;
    margin: 25px 0 35px 0;
}
 
.menu-administracion {
    display: flex;
    flex-direction: column;
    gap: 65px;
}

 
.menu-administracion button {
    width: 100%;
    min-height: 90px;
    padding: 20px;
    font-size: 28px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #0b5ed7;
    color: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.18);
}

.menu-administracion button:hover {
    background: #084298;
    transform: translateY(-1px);
}


/* CELULAR */

@media (max-width:768px){

    .categorias{
        display:flex;
        flex-direction:row;
        flex-wrap:nowrap;
        gap:12px;
        width:100%;
        margin:20px auto;
        padding:25px 10px;
        overflow-x:auto;
        overflow-y:hidden;
        white-space:nowrap;
        -webkit-overflow-scrolling:touch;
    }

    .categorias::-webkit-scrollbar{
        display:none;
    }

    .categorias button{
        flex:0 0 auto;
        min-width:200px;
        height:60px;
        padding:0 30px;
        font-size:20px;
        border-radius:12px;
        background:#0d6efd;
        color:white;
        border:none;
        font-weight:bold;
        cursor:pointer;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    #abrirAdministracion{
        flex:0 0 auto;
        width:40%;
        min-width:200px;
        height:100px;
        padding:12px;
        font-size:30px;
        font-weight:bold;
        border-radius:15px;
    }

}


/* =============================== */
/* ADMINISTRACIÓN - TAMAÑO CELULAR */
/* =============================== */

@media (max-width:768px){

  #paginaAdministracion{
    width:100%;
    margin:0 auto;
    padding:0;
    box-sizing:border-box;
    background:transparent;
    border:none;
    box-shadow:none;
}

    #paginaAdministracion::before{
        font-size:38px;
        margin-bottom:10px;
    }

    #paginaAdministracion::after{
        font-size:20px;
        margin-top:25px;
    }

    .panel-administracion{
    width:90%;
    max-width:450px;
    min-height:650px;
    margin:25px auto;
    padding:30px 25px;
    box-sizing:border-box;
    background:white;
    border-radius:18px;
    box-shadow:0 6px 20px rgba(0,0,0,0.18);
    border:1px solid #ddd;
}

    .panel-administracion h2{
        font-size:28px;
        line-height:1.2;
        margin-bottom:30px;
    }

    .menu-administracion{
        gap:18px;
    }

    .menu-administracion button{
        width:100%;
        min-height:62px;
        padding:15px 12px;
        font-size:20px;
    }

}





/* ========================= */
/*      PÁGINA CARRITO        */
/* ========================= */

#paginaCarrito{

    display:none;
    width:95%;
    max-width:900px;
    margin:20px auto;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);

}

.productoCarrito{

    display:flex;
    align-items:center;
    gap:15px;
    border-bottom:1px solid #ddd;
    padding:15px 0;

}

.productoCarrito img{

    width:90px;
    height:90px;
    object-fit:contain;

}

.infoProducto{

    flex:1;

}

.infoProducto h3{

    margin:0;
    font-size:20px;

}

.infoProducto p{

    margin:8px 0;
    color:#d32f2f;
    font-weight:bold;
    font-size:20px;

}


.filaCarrito{

    display:grid;
    grid-template-columns:140px 1fr 100px 120px 70px;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #ddd;
    padding:12px 0;

}

.colImagen{

    width:70px;
    flex-shrink:0;

}

.colImagen img{

    width:60px;
    height:60px;
    object-fit:contain;
    display:block;

}

.colCantidad{

    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

}

.colCantidad span{
    font-size:22px;
    font-weight:bold;
}


.colCantidad button{
    width:40px;
    height:40px;
    font-size:20px;
    cursor:pointer;
}

.colProducto{
    font-weight:bold;
    font-size:20px;
}


.colPrecio,
.colImporte{
    text-align:center;
    font-weight:bold;
    font-size:20px;
}
.colImporte{

    color:#d32f2f;

}

.colEliminar{

    text-align:center;

}

.colEliminar button{
    background:#d32f2f;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    font-size:20px;
    cursor:pointer;
}

.encabezadoCarrito{

    display:grid;
    grid-template-columns:140px 1fr 100px 120px 70px;
    gap:10px;
    font-weight:bold;
    background:#0d6efd;
    color:white;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
    text-align:center;

}

    /* CARRITO EN CELULAR */

#carritoVentana{

    width:90%;
    max-width:500px;
    max-height:80vh;
    padding:25px;
    border-radius:15px;

}


#carritoVentana h2{

    font-size:32px;

}


#listaCarrito{

    font-size:22px;

}


#totalCarrito{

    font-size:28px;

}


.botonesCarrito{

    flex-direction:column;
    gap:15px;

}


.botonesCarrito button{

    width:100%;
    padding:18px;
    font-size:22px;

}




</style>

</head>

<script>



// =========================
//       JAVASCRIPT CODMAR
// =========================


// =========================
//     MODO ADMINISTRADOR
// =========================

let modoAdministrador = false;

function activarAdministrador(){

    // Si el botón Administración ya está visible,
    // doble clic en CODMAR lo vuelve a ocultar
    if(modoAdministrador){

        modoAdministrador = false;

        document.getElementById("abrirAdministracion").style.display = "none";

        return;
    }

    // Si está oculto, pedir contraseña
    let clave = prompt("Contraseña de administrador:");

    if(clave === "CODMAR2026"){

        modoAdministrador = true;

        document.getElementById("abrirAdministracion").style.display = "flex";

    }else{

        alert("Contraseña incorrecta.");

    }
}

// =========================
//       CARRITO
// =========================

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];


// Actualiza el número del botón carrito

function actualizarCarrito(){

    document.getElementById("verCarrito").innerHTML =
    "🛒 Carrito (" + carrito.length + ")";
    localStorage.setItem("carrito", JSON.stringify(carrito));

}



// Agregar productos

function agregarCarrito(nombre, precio, imagen){


    precio = parseFloat(precio.replace("$","").trim());


    let productoExistente = carrito.find(function(producto){

        return producto.nombre === nombre;

    });



    if(productoExistente){


        productoExistente.cantidad++;


    }else{


     carrito.push({

    nombre:nombre,
    precio:precio,
    cantidad:1,
    imagen:imagen


});

    }



    actualizarCarrito();



    alert(
        nombre +
        " agregado al carrito.\n\nProductos en el carrito: "
        + carrito.length
    );


}



// Mostrar carrito

function verCarrito(){

    // Ocultar catálogo

    document.getElementById("catalogo").style.display = "none";

    // Ocultar botón del carrito

    document.getElementById("verCarrito").style.display = "none";

    // Mostrar página del carrito

    document.getElementById("paginaCarrito").style.display = "block";


    document.querySelector(".categorias").style.display = "none";

    document.getElementById("buscar").style.display = "none";


   // Mostrar cliente seleccionado
   let clienteSeleccionado =
    JSON.parse(localStorage.getItem("clienteSeleccionadoCODMAR"));

   let cajaCliente =
   document.getElementById("clienteSeleccionadoCarrito");

  if(cajaCliente){

  if(clienteSeleccionado){

    cajaCliente.innerHTML =
        "👤 Cliente: " + clienteSeleccionado.nombre;

}else{

    cajaCliente.innerHTML =
        "👤 Ningún cliente seleccionado";

}

}

    let contenido = "";
    let total = 0;

    carrito.forEach(function(producto){

        contenido += `

<div class="filaCarrito">

    <div class="colCantidad">
        <button onclick="disminuirCantidad('${producto.nombre}')">➖</button>
        <span>${producto.cantidad}</span>
        <button onclick="aumentarCantidad('${producto.nombre}')">➕</button>
    </div>

    <div class="colProducto">
        ${producto.nombre}
    </div>

    <div class="colPrecio">
        $${producto.precio.toFixed(2)}
    </div>

    <div class="colImporte">
        $${(producto.precio * producto.cantidad).toFixed(2)}
    </div>

    <div class="colEliminar">
        <button onclick="eliminarProducto('${producto.nombre}')">🗑</button>
    </div>

</div>

`;

        total += producto.precio * producto.cantidad;

    });

    if(carrito.length === 0){

        document.getElementById("listaCarritoPagina").innerHTML =
        "<h3 style='text-align:center;'>🛒 El carrito está vacío</h3>";

        document.getElementById("totalPagina").innerHTML = "";

    }else{

        document.getElementById("listaCarritoPagina").innerHTML =

        `

<div class="encabezadoCarrito">

    <div>Cantidad</div>
    <div>Producto</div>
    <div>Precio</div>
    <div>Importe</div>
    <div></div>

</div>

` + contenido;

        document.getElementById("totalPagina").innerHTML =
        "TOTAL: $" + total.toLocaleString("es-MX",{
            minimumFractionDigits:2,
            maximumFractionDigits:2
        });

    }

}

// BOTÓN ADMINISTRACIÓN DESDE CARRITO

function abrirAdministracionDesdeCarrito(){

    document.getElementById("paginaCarrito").style.display = "none";

    document.getElementById("paginaAdministracion").style.display = "block";

}





// Aumentar cantidad

function aumentarCantidad(nombre){


    let producto = carrito.find(p => p.nombre === nombre);


    producto.cantidad++;


    verCarrito();

    actualizarCarrito();


}



// Disminuir cantidad

function disminuirCantidad(nombre){


    let producto = carrito.find(p => p.nombre === nombre);



    if(producto.cantidad > 1){


        producto.cantidad--;


    }else{


        eliminarProducto(nombre);


    }



    verCarrito();

    actualizarCarrito();


}




// Eliminar producto

function eliminarProducto(nombre){


    carrito = carrito.filter(p => p.nombre !== nombre);



    verCarrito();

    actualizarCarrito();


}


// Vaciar carrito

function vaciarCarrito(){

    carrito = [];

   localStorage.removeItem("clienteSeleccionadoCODMAR");

    actualizarCarrito();

    verCarrito();

}

// =========================
//       ELIMINAR VENTA
// =========================


function eliminarVenta(indice){

    let ventas =
        JSON.parse(localStorage.getItem("ventasCODMAR")) || [];

    let venta = ventas[indice];

    if(!venta){
        return;
    }

    let confirmar = confirm(
        "¿Quieres eliminar la Venta #" +
        (indice + 1) +
        " de " +
        venta.cliente +
        "?"
    );

    if(!confirmar){
        return;
    }

    ventas.splice(indice, 1);

    localStorage.setItem(
        "ventasCODMAR",
        JSON.stringify(ventas)
    );

    mostrarVentas();

}

// =========================
//    GUARDAR NUEVO PRODUCTO
// =========================

function guardarNuevoProducto(){

    let nombre =
        document.getElementById("nuevoProductoNombre").value.trim();

    let presentacion =
        document.getElementById("nuevoProductoPresentacion").value.trim();

    let precio =
        document.getElementById("nuevoProductoPrecio").value.trim();

    let categoria =
        document.getElementById("nuevoProductoCategoria").value;

    let imagenArchivo =
        document.getElementById("nuevoProductoImagen").files[0];

    let imagenURL =
        document.getElementById("nuevoProductoImagenURL").value.trim();


    // =========================
    // VALIDACIONES
    // =========================

    if(nombre === ""){

        alert("Escribe el nombre del producto.");
        return;

    }

    if(precio === ""){

        alert("Escribe el precio del producto.");
        return;

    }

    if(categoria === ""){

        alert("Selecciona una categoría.");
        return;

    }

    if(!imagenArchivo && imagenURL === ""){

        alert(
            "Selecciona una imagen o proporciona una imagen en línea."
        );

        return;

    }


    // =========================
    // OBTENER PRODUCTOS
    // =========================

    let productosGuardados =
        JSON.parse(
            localStorage.getItem("productosCODMAR")
        ) || [];


    // =========================
    // CREAR NOMBRE COMPLETO
    // =========================

    let nombreCompleto =
        nombre +
        (presentacion
            ? " - " + presentacion
            : "");


    // =========================
    // FUNCIÓN PARA GUARDAR
    // =========================

    function guardarProducto(imagen){

        let nuevoProducto = {

            imagen: imagen,

            nombre: nombreCompleto,

            precio: parseFloat(precio),

            categoria: categoria

        };


        // =========================
        // AGREGAR PRODUCTO
        // =========================

        productosGuardados.push(nuevoProducto);


        // =========================
        // ORDEN ALFABÉTICO
        // =========================

        productosGuardados.sort(function(a, b){

            return a.nombre.localeCompare(
                b.nombre,
                "es",
                {
                    sensitivity: "base"
                }
            );

        });


        // =========================
        // GUARDAR
        // =========================

        localStorage.setItem(
            "productosCODMAR",
            JSON.stringify(productosGuardados)
        );


        alert("Producto guardado correctamente.");


        // =========================
        // LIMPIAR CAMPOS
        // =========================

        document.getElementById(
            "nuevoProductoNombre"
        ).value = "";

        document.getElementById(
            "nuevoProductoPresentacion"
        ).value = "";

        document.getElementById(
            "nuevoProductoPrecio"
        ).value = "";

        document.getElementById(
            "nuevoProductoCategoria"
        ).value = "";

        document.getElementById(
            "nuevoProductoImagen"
        ).value = "";

        document.getElementById(
            "nuevoProductoImagenURL"
        ).value = "";


        document.getElementById(
            "vistaPreviaImagen"
        ).innerHTML = "";


        // =========================
        // VOLVER A ADMINISTRACIÓN
        // =========================

        document.getElementById(
            "paginaAgregarProducto"
        ).style.display = "none";

        document.getElementById(
            "paginaAdministracion"
        ).style.display = "block";


        // =========================
        // ACTUALIZAR CATÁLOGO
        // =========================

        if(typeof mostrarProductos === "function"){

            mostrarProductos(productosGuardados);

        }

    }


    // =========================
    // IMAGEN DESDE INTERNET
    // =========================

    if(imagenURL !== ""){

        guardarProducto(imagenURL);

        return;

    }


    // =========================
    // IMAGEN DESDE DISPOSITIVO
    // =========================

    if(imagenArchivo){

        let lector = new FileReader();


        lector.onload = function(e){

            guardarProducto(e.target.result);

        };


        lector.readAsDataURL(imagenArchivo);

    }

}

// =========================
// DESPLAZAR CATEGORÍAS CON MOUSE
// =========================

const barraCategorias = document.querySelector(".categorias");

let arrastrandoCategorias = false;
let inicioX;
let scrollInicial;

barraCategorias.addEventListener("mousedown", function(e){

    arrastrandoCategorias = true;

    inicioX = e.pageX - barraCategorias.offsetLeft;

    scrollInicial = barraCategorias.scrollLeft;

    barraCategorias.style.cursor = "grabbing";

});


barraCategorias.addEventListener("mouseleave", function(){

    arrastrandoCategorias = false;

    barraCategorias.style.cursor = "grab";

});


barraCategorias.addEventListener("mouseup", function(){

    arrastrandoCategorias = false;

    barraCategorias.style.cursor = "grab";

});


barraCategorias.addEventListener("mousemove", function(e){

    if(!arrastrandoCategorias) return;

    e.preventDefault();

    let x = e.pageX - barraCategorias.offsetLeft;

    let movimiento = (x - inicioX) * 1.5;

    barraCategorias.scrollLeft =
        scrollInicial - movimiento;

});


barraCategorias.style.cursor = "grab";





</script>
